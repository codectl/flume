name: release-please

on:
  workflow_call:
    inputs:
      release-type:
        description: 'release-please release type, e.g. terraform-module, go, simple'
        required: false
        type: string
        default: terraform-module

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: ${{ inputs.release-type }}
